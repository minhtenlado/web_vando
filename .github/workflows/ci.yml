name: CI & Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Type Check & Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mock' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-dummy-session-secret-key-32chars-minimum' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-dummy-admin-password' }}
